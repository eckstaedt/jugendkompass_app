# Store-Builds (Google Play + App Store), gesteuert über den Branch
#
#   develop  → bei jedem Merge: Android Play "internal"          | iOS: Xcode Cloud → TestFlight intern
#   main     → bei jedem Merge: Android Play $PLAY_EXTERNAL_TRACK | iOS: Xcode Cloud → TestFlight extern
#              danach per Klick:
#                android:production  → diese Version nach "production" (PLAY_ROLLOUT, z. B. 0.2)
#                ios:submit-review   → neuesten TestFlight-Build der Version zur App-Store-Prüfung
#                                      (IOS_AUTO_RELEASE=true: nach Freigabe automatisch veröffentlichen)
#
# Gebaut wird nur, wenn sich App-Code geändert hat (oder bei "Run pipeline" von Hand).
# Version kommt aus pubspec.yaml, die Build-Nummer zählt die Pipeline selbst hoch.

.app_changes: &app_changes
  - lib/**/*
  - assets/**/*
  - android/**/*
  - ios/**/*
  - pubspec.yaml
  - pubspec.lock
  - dotenv
  - fastlane/**/*
  - .gitlab/ci/stores.yml

.store_rules:
  rules:
    - if: $TASK || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "web"
      variables: { PLAY_TRACK: internal }
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
      changes: *app_changes
      variables: { PLAY_TRACK: internal }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      variables: { PLAY_TRACK: $PLAY_EXTERNAL_TRACK }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *app_changes
      variables: { PLAY_TRACK: $PLAY_EXTERNAL_TRACK }

# Freigabe für die Öffentlichkeit: nur auf main, nur per Klick
.release_rules:
  rules:
    - if: $TASK || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *app_changes
      when: manual

.fastlane_linux:
  image: $RUBY_IMAGE
  cache:
    key:
      files: [Gemfile.lock]
      prefix: gems
    paths: [vendor/ruby]
  before_script:
    - bundle config set --local path vendor/ruby
    - bundle config set --local deployment true
    - bundle install --jobs 4 --quiet

release:verify:
  stage: check
  image: alpine:3.22
  extends: .store_rules
  needs: []
  script:
    - version=$(sed -nE 's/^version:[[:space:]]*([0-9.]+)\+?.*/\1/p' pubspec.yaml)
    - '[ -n "$version" ] || { echo "Keine version: in pubspec.yaml"; exit 1; }'
    - echo "App $version → Play-Track $PLAY_TRACK"
    - echo "APP_VERSION=$version" > release.env
  artifacts:
    reports:
      dotenv: release.env

# ---------------------------------------------------------------- Android

android:version-code:
  stage: build
  extends: [.fastlane_linux, .store_rules]
  needs: [release:verify]
  script:
    - bundle exec fastlane android next_version_code
  artifacts:
    reports:
      dotenv: fastlane/android.env

android:build:
  stage: build
  extends: [.flutter, .store_rules]
  needs:
    - release:verify
    - android:version-code
    - job: check:flutter
      optional: true
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.cache/gradle
  cache:
    - key: flutter-$FLUTTER_VERSION
      paths: [.cache/flutter]
    - key:
        files: [pubspec.lock]
        prefix: pub
      paths: [.cache/pub]
    - key: gradle
      paths: [.cache/gradle]
  script:
    - |
      for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
        eval "val=\${$v:-}"; [ -n "$val" ] || { echo "CI/CD-Variable $v fehlt."; exit 1; }
      done
    # Upload-Keystore (.jks) als base64 (GitLab-Variablen sind Text, keine Binärdateien)
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
    - |
      cat > android/key.properties <<EOF
      storeFile=upload-keystore.jks
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      EOF
    - flutter build appbundle --release --build-number="$ANDROID_VERSION_CODE"
    - mkdir -p dist && cp build/app/outputs/bundle/release/app-release.aab "dist/jugendkompass-$APP_VERSION-$ANDROID_VERSION_CODE.aab"
  after_script:
    - rm -f android/app/upload-keystore.jks android/key.properties
  artifacts:
    paths: [dist/*.aab]
    expire_in: 30 days

android:upload:
  stage: store
  extends: [.fastlane_linux, .store_rules]
  needs: [android:build, android:version-code, release:verify]
  resource_group: play-store
  environment:
    name: play/$PLAY_TRACK
  script:
    - bundle exec fastlane android upload track:"$PLAY_TRACK" aab:"$(ls dist/*.aab | head -1)"

android:production:
  stage: release
  extends: [.fastlane_linux, .release_rules]
  needs: [android:upload, android:version-code, release:verify]
  resource_group: play-store
  environment:
    name: play/production
    url: https://play.google.com/store/apps/details?id=io.stephanus.jugendkompass
  script:
    - bundle exec fastlane android production from:"$PLAY_EXTERNAL_TRACK"

# ---------------------------------------------------------------- iOS

# iOS baut standardmäßig Xcode Cloud (ios/ci_scripts/ci_post_clone.sh, Workflows für develop und main).
# Dieser Job ist nur die Alternative mit eigenem Mac-Runner: Variable IOS_BUILDER=gitlab-mac setzen.
ios:testflight:
  stage: store
  rules:
    - if: $IOS_BUILDER != "gitlab-mac"
      when: never
    - !reference [.store_rules, rules]
  tags: [macos]
  needs:
    - release:verify
    - job: check:flutter
      optional: true
  resource_group: app-store
  environment:
    name: appstore/testflight
  variables:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
    PUB_CACHE: $HOME/.pub-cache
  before_script:
    - source .gitlab/ci/flutter-env.sh
    - flutter pub get
    - bundle config set --local path vendor/ruby
    - bundle install --jobs 4 --quiet
  script:
    - bundle exec fastlane ios beta
  artifacts:
    paths: [dist/*.ipa]
    reports:
      dotenv: fastlane/ios.env
    expire_in: 30 days

ios:submit-review:
  stage: release
  extends: [.fastlane_linux, .release_rules]
  needs:
    - release:verify
    - job: ios:testflight
      optional: true
  resource_group: app-store
  environment:
    name: appstore/production
    url: https://apps.apple.com/app/id1559123537
  script:
    - bundle exec fastlane ios submit_review
