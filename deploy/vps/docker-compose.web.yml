# Web-Auftritte: Flutter-Web (www + Apex), Admin-PWA, Übersetzungs-Panel und der
# Share-Link-Dienst (ersetzt die Vercel-Function web/api/share.js).
#
#   cd /docker/jugendkompass && docker compose -f docker-compose.web.yml up -d
#
# Variablen kommen aus .env (Symlink auf jugendkompass.env, von setup.sh angelegt).
# Inhalte liegen in ./sites/{www,admin,translate} und werden per CI (rsync) befüllt.

name: jugendkompass-web

services:
  web:
    image: nginx:1.27-alpine
    container_name: jk-web
    restart: unless-stopped
    environment:
      WWW_DOMAIN: ${WWW_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      TRANSLATE_DOMAIN: ${TRANSLATE_DOMAIN}
      STATUS_DOMAIN: ${STATUS_DOMAIN}
    volumes:
      - ./web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./sites:/sites:ro
    depends_on:
      - share
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      # Admin + Übersetzungs-Panel + Status-Dashboard
      traefik.http.routers.jk-web.rule: Host(`${ADMIN_DOMAIN}`) || Host(`${TRANSLATE_DOMAIN}`) || Host(`${STATUS_DOMAIN}`)
      traefik.http.routers.jk-web.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.jk-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.jk-web.service: jk-web
      # www + Hauptdomain: eigener Router, damit das Zertifikat per DNS-Challenge
      # schon vor der DNS-Umstellung geholt werden kann (TRAEFIK_WWW_CERTRESOLVER)
      traefik.http.routers.jk-www.rule: Host(`${WWW_DOMAIN}`) || Host(`${APEX_DOMAIN}`)
      traefik.http.routers.jk-www.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.jk-www.tls.certresolver: ${TRAEFIK_WWW_CERTRESOLVER:-${TRAEFIK_CERTRESOLVER}}
      traefik.http.routers.jk-www.service: jk-web
      traefik.http.services.jk-web.loadbalancer.server.port: "80"
      # HTTP → HTTPS
      traefik.http.routers.jk-web-http.rule: Host(`${WWW_DOMAIN}`) || Host(`${APEX_DOMAIN}`) || Host(`${ADMIN_DOMAIN}`) || Host(`${TRANSLATE_DOMAIN}`) || Host(`${STATUS_DOMAIN}`)
      traefik.http.routers.jk-web-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.jk-web-http.middlewares: jk-web-https
      traefik.http.middlewares.jk-web-https.redirectscheme.scheme: https
      traefik.http.middlewares.jk-web-https.redirectscheme.permanent: "true"

  share:
    image: node:22-alpine
    container_name: jk-share
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      SUPABASE_URL: https://${API_DOMAIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      PORT: "3000"
    volumes:
      - ./web/share-server.js:/app/server.js:ro
      # share.js kommt mit dem Flutter-Web-Build (build/web/api/share.js)
      - ./sites/www/api:/app/api:ro
    networks:
      - default

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
