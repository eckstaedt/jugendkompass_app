name: English Audio (AI voice)

# Creates an English AI-voice version of every article audio with the free,
# open Kokoro-82M model (Apache-2.0, runs on the GitHub CPU – no API costs).
# The app plays it automatically when the app language is English.
#
# Runs every 15 minutes: new audios, restarts from the translation panel (and changed English texts) are picked up
# automatically. The first run works through the backlog in parallel.
#
# Needs ONE repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY   (or SUPABASE_ACCESS_TOKEN – the key is then
#                                fetched through the Management API)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel jobs"
        default: "8"

concurrency:
  group: english-audio
  cancel-in-progress: false

env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_ACCESS_TOKEN) is missing."
            exit 1
          fi
      - name: Count pending audios
        id: plan
        env:
          PLAN_ONLY: "1"
        run: python3 tool/tts/generate_english_audio.py
      - name: Shards
        id: shards
        run: |
          n="${{ inputs.shards }}"; n="${n:-8}"
          pending="${{ steps.plan.outputs.pending }}"
          # few new audios → one job is enough
          if [ "${pending:-0}" -le 4 ]; then n=1; fi
          echo "list=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    if: needs.plan.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/tts/requirements.txt

      - name: Cache Kokoro model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o models/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          curl -sSL -o models/voices-v1.0.bin "$base/voices-v1.0.bin"

      - name: Install
        run: |
          pip install -r tool/tts/requirements.txt
          ffmpeg -version | head -1

      - name: Generate English audio
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          TIME_BUDGET_MIN: "300"
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
        run: python3 tool/tts/generate_english_audio.py
