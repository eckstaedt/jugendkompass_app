name: Android → Play Store

# Builds a signed Android App Bundle (.aab) and uploads it to Google Play.
# No local machine needed.
#
# Start it: GitHub → Actions → "Android → Play Store" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   store password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# Optional, for the automatic upload:
#   PLAY_SERVICE_ACCOUNT_JSON   Google Cloud service account JSON with
#                               "Release manager" access in the Play Console
#
# Without the keystore secrets the workflow only runs a debug-signed compile
# check. Without PLAY_SERVICE_ACCOUNT_JSON the signed .aab is kept as a
# downloadable artifact for a manual upload in the Play Console.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal, alpha, beta, production)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      build_number:
        description: "versionCode override (empty = from pubspec.yaml)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: android-play
  cancel-in-progress: false

env:
  PACKAGE_NAME: io.stephanus.jugendkompass
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android keystore secrets missing – compile check only (no Play upload)."
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON missing – the .aab is kept as artifact for a manual upload."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Keystore
        if: steps.secrets.outputs.signing == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build number
        id: build_number
        run: |
          override="${{ inputs.build_number }}"
          pubspec=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "value=${override:-$pubspec}" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ steps.build_number.outputs.value }}

      - name: Keep AAB as artifact
        if: steps.secrets.outputs.signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jugendkompass-aab-${{ steps.build_number.outputs.value }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play
        if: steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ (inputs.track || 'internal') == 'internal' && 'completed' || 'draft' }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
