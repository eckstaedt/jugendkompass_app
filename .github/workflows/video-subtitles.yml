name: Video subtitles (English, Whisper)

# English subtitles for the German videos (free Whisper model, CPU).
# Daily + manual: only videos without subtitles are processed.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: video-subtitles
  cancel-in-progress: false

env:
  # Nach der Umstellung Repo-Variable SUPABASE_URL=https://api.jugendkompass.com setzen.
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://vdcdibvclaulqxfjyzpq.supabase.co' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet faster-whisper
      - name: Subtitles
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "8"
          WHISPER_MODEL: large-v3
        run: python3 tool/subtitles/make_subtitles.py

  russian:
    needs: subtitles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet transformers sentencepiece sacremoses torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Russian subtitles (opus-mt-en-ru)
        run: python3 tool/subtitles/translate_subtitles.py
