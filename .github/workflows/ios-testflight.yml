name: iOS → TestFlight

# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# No local Mac/Xcode needed: certificates and provisioning profiles are
# fetched (or created) automatically through the App Store Connect API.
#
# Start it: GitHub → Actions → "iOS → TestFlight" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect → Users and Access →
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Integrations → App Store Connect API
#   APP_STORE_CONNECT_PRIVATE_KEY     (team key, role "Admin"; the .p8 file content)
#   CERTIFICATE_PRIVATE_KEY           RSA private key (PEM) used for the
#                                     distribution certificate, create once with
#                                     ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
#
# Without these secrets the workflow still runs analyze + an unsigned build
# (useful as a compile check), and skips signing/upload.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (needs secrets)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: io.stephanus.jugendkompass
  WIDGET_BUNDLE_ID: io.stephanus.jugendkompass.VerseWidget
  # Notification Service Extension (shows images in push notifications)
  NSE_BUNDLE_ID: io.stephanus.jugendkompass.NotificationService
  APP_STORE_APP_ID: "1559123537"
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] \
             && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App Store Connect secrets missing – building unsigned only (no TestFlight upload)."
          fi

      # Firebase comes in via CocoaPods; newer Flutter versions additionally
      # pull it via Swift Package Manager, which causes "redefinition of
      # module 'FirebaseCore'". Stay on CocoaPods only.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ---------- compile check without signing ----------
      - name: Build (unsigned)
        if: steps.secrets.outputs.signing != 'true'
        run: flutter build ios --release --no-codesign

      # ---------- signed build + TestFlight upload ----------
      - name: Install Codemagic CLI tools
        if: steps.secrets.outputs.signing == 'true'
        run: pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Code signing (certificate + profiles via App Store Connect API)
        if: steps.secrets.outputs.signing == 'true'
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          # Register the notification extension's bundle ID once (ignore
          # "already exists"), then fetch/create its profile.
          app-store-connect bundle-ids create "$NSE_BUNDLE_ID" \
            --name "Jugendkompass Notification Service" --platform IOS || true
          app-store-connect fetch-signing-files "$NSE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build number
        if: steps.secrets.outputs.signing == 'true'
        id: build_number
        run: |
          latest=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          pubspec=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          next=$(( (latest > pubspec ? latest : pubspec) + 1 ))
          echo "Latest TestFlight build: $latest, pubspec: $pubspec → $next"
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        if: steps.secrets.outputs.signing == 'true'
        run: |
          flutter build ipa --release \
            --build-number=${{ steps.build_number.outputs.value }} \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload to TestFlight
        if: steps.secrets.outputs.signing == 'true' && (github.event_name == 'push' || inputs.upload)
        run: |
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -1)"

      - name: Keep IPA as artifact
        if: steps.secrets.outputs.signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jugendkompass-ipa-${{ steps.build_number.outputs.value }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always() && steps.secrets.outputs.signing == 'true'
        run: keychain use-login || true
