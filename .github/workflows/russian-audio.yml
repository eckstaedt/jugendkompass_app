name: Russian Audio (Piper)

# Russian AI voice for article audios (Piper, free/open source). Needs the
# Russian article text (content_translations ru). Daily + manual.
on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

concurrency:
  group: russian-audio
  cancel-in-progress: false

env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet piper-tts soundfile numpy
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium
          curl -sSLo ru_RU-dmitri-medium.onnx "$base/ru_RU-dmitri-medium.onnx"
          curl -sSLo ru_RU-dmitri-medium.onnx.json "$base/ru_RU-dmitri-medium.onnx.json"
      - name: Russian audio
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: python3 tool/tts/generate_russian_audio.py
