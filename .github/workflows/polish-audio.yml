name: Polish Audio (Piper)

# Polish AI voice for article audios (Piper, free/open source). Needs the
# Polish article text (content_translations pl). Daily + manual.
on:
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:

concurrency:
  group: polish-audio
  cancel-in-progress: false

env:
  # Nach der Umstellung Repo-Variable SUPABASE_URL=https://api.jugendkompass.com setzen.
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://vdcdibvclaulqxfjyzpq.supabase.co' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet piper-tts soundfile numpy
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/darkman/medium
          curl -sSLo pl_PL-darkman-medium.onnx "$base/pl_PL-darkman-medium.onnx"
          curl -sSLo pl_PL-darkman-medium.onnx.json "$base/pl_PL-darkman-medium.onnx.json"
      - name: Polish audio
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: python3 tool/tts/generate_polish_audio.py
