name: Admin → VPS

# Baut die Admin-PWA gegen das Supabase auf dem eigenen VPS und kopiert sie per
# rsync nach /docker/jugendkompass/sites/admin. Das Lovable-Hosting zeigt
# weiterhin auf die Cloud, bis es nach der Umstellung abgeschaltet wird.
#
# Repository-Secrets: VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS
#   (dieselben Werte wie im App-Repo)
# Repository-Variablen (optional): VPS_SSH_PORT (22), VPS_API_URL (https://api.jugendkompass.com)
#
# Bis zur Umstellung nur manuell starten; danach push-Trigger einkommentieren.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: admin-vps-deploy
  cancel-in-progress: true

env:
  API_URL: ${{ vars.VPS_API_URL || 'https://api.jugendkompass.com' }}
  SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
  TARGET: /docker/jugendkompass/sites/admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Point build to the VPS backend
        run: |
          # client.ts wird von Lovable generiert und enthält die Cloud-URL fest.
          sed -i "s|https://[a-z0-9]*\.supabase\.co|${API_URL}|g" src/integrations/supabase/client.ts
          grep -q "${API_URL}" src/integrations/supabase/client.ts
          echo "VITE_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          npm ci --legacy-peer-deps
          npm run build
          test -f dist/index.html

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KEY / VPS_SSH_KNOWN_HOSTS fehlen."; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload
        env:
          HOST: ${{ secrets.VPS_SSH_HOST }}
          USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          rsync -az --delete-after -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" dist/ "$USER@$HOST:$TARGET/"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_deploy
